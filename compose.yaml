services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: amex
      POSTGRES_USER: amex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5544:5432'
    volumes:
      - amex_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amex -d amex']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  amex_db:
